name: Deploy to Draft/Staging Server

on:
  push:
    branches: [ "draft" ]

jobs:
  deploy-draft:
    runs-on: ubuntu-latest

    steps:
    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.DRAFT_SSH_PRIVATE_KEY }}
        
    - name: Deploy via SSH Git Pull
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.DRAFT_SERVER_USERNAME }}@${{ secrets.DRAFT_SERVER_HOST }} << 'EOF'
          set -e # Stop script immediately if any command fails!
          
          cd /home/happybangladesh-test/htdocs/test.happybangladesh.site
          
          # Initialize git if it doesn't exist yet
          if [ ! -d ".git" ]; then
            git init
            git remote add origin https://github.com/raseloriginal/happybangladesh.git
          fi
          
          # Trust the directory for git commands
          git config --global --add safe.directory /home/happybangladesh-test/htdocs/test.happybangladesh.site
          
          # Fetch changes and reset local branch to match the remote draft branch
          git fetch origin draft
          git reset --hard origin/draft
          
          # Ensure correct ownership and permissions
          chown -R happybangladesh-test:happybangladesh-test /home/happybangladesh-test/htdocs/test.happybangladesh.site 2>/dev/null || true
          
          # Create and set permissions for logs/storage if needed
          mkdir -p storage/logs storage/framework/views storage/cache logs
          chmod -R 775 storage logs 2>/dev/null || true
          chmod -R 755 public 2>/dev/null || true
          
          echo "Draft Deploy OK at $(date)"
        EOF
