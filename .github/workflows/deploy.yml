name: Deploy to Live Server

on:
  push:
    branches: [ "main" ] # Change this to 'master' if your main branch is named 'master'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script_stop: true
        script: |
          # 1. Ensure directory exists and navigate to it
          mkdir -p /home/happybangladesh/htdocs/happybangladesh.site
          cd /home/happybangladesh/htdocs/happybangladesh.site
          
          # 2. Mark directory as safe for Git
          git config --global --add safe.directory /home/happybangladesh/htdocs/happybangladesh.site || true
          
          # 3. Configure Git repository if not initialized
          if [ ! -d ".git" ]; then
            echo "Initializing new Git repository..."
            git init
            git checkout -B main
            git remote add origin https://github.com/${{ github.repository }}.git
          fi
          
          # 4. Fetch latest code (HTTPS fallback to SSH if private repo)
          echo "Fetching latest changes..."
          if ! git fetch origin main; then
            echo "HTTPS fetch failed. Attempting fetch via SSH URL..."
            git remote set-url origin git@github.com:${{ github.repository }}.git
            git fetch origin main
          fi
          
          # 5. Reset working tree to match origin/main
          echo "Updating files to match origin/main..."
          git reset --hard origin/main
          git branch --set-upstream-to=origin/main main || true
          echo "Deployment completed successfully!"


