name: Deploy to Live Server

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Copy files via SCP
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        source: ".,!.git,!.github"
        target: /home/happybangladesh/htdocs/happybangladesh.site
        rm: false
        overwrite: true
        strip_components: 0

    - name: Post-deploy permissions via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          cd /home/happybangladesh/htdocs/happybangladesh.site

          # Ensure storage and log directories exist with proper write permissions
          mkdir -p storage/logs storage/framework/views storage/cache logs
          chmod -R 775 storage logs 2>/dev/null || true
          chmod -R 755 public 2>/dev/null || true

          echo "Deployment completed successfully!"
