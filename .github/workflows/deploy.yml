name: Deploy to Live Server

on:
  push:
    branches: [ "main" ] # Change this to 'master' if your main branch is named 'master'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script_stop: true
        script: |
          # Navigate to project directory
          cd /home/happybangladesh/htdocs/happybangladesh.site
          
          # Check if directory is a git repository
          if [ -d ".git" ]; then
            echo "Git repository found. Pulling latest code..."
            git pull origin main
          else
            echo "Not a git repository yet. Initializing and pulling code..."
            git init
            git remote add origin https://github.com/${{ github.repository }}.git || git remote set-url origin https://github.com/${{ github.repository }}.git
            git fetch origin main
            git reset --hard origin/main
            git branch --set-upstream-to=origin/main main
          fi

