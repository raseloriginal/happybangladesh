name: Deploy to Live Server

on:
  push:
    branches: [ "main" ] # Change this to 'master' if your main branch is named 'master'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          # 1. Navigate to your project directory on the live server.
          # ⚠️ IMPORTANT: Replace this with the actual path to your site on CloudPanel!
          # Example: cd /home/your-site-user/htdocs/happybangladesh.com
          cd /path/to/your/project/directory
          
          # 2. Pull the latest code
          git pull origin main
          
          # 3. Add any other commands you might need here (e.g., clearing cache, composer install, etc.)
